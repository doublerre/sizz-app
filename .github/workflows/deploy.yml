name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sizz-frontend-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: sizz-frontend
          path: dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: [self-hosted, sizz-deploy]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sizz-frontend
          path: dist
      - name: Deploy app-01, then app-02
        shell: bash
        run: |
          set -euo pipefail

          release="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=10 -i /home/actions/.ssh/sizz_deploy)

          for host in 10.10.10.20 10.10.10.21; do
            ssh "${ssh_options[@]}" "deploy@${host}" \
              "mkdir -p '/var/www/sizz/releases/${release}'"
            scp "${ssh_options[@]}" -r dist/. \
              "deploy@${host}:/var/www/sizz/releases/${release}/"
            ssh "${ssh_options[@]}" "deploy@${host}" \
              "set -eu; test -s '/var/www/sizz/releases/${release}/index.html'; ln -sfn 'releases/${release}' /var/www/sizz/current; test -s /var/www/sizz/current/index.html"
          done
